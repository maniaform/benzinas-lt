<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KuroPulsas.lt | Mažiausios benzino (A95, A98) ir dyzelino kainos Lietuvoje</title>
    <meta name="description" content="Kasdien atnaujinamos mažiausios A95, A98 benzino ir dyzelino kainos Lietuvos degalinėse: Jozita, Neste, Circle K, Viada, Baltic Petroleum, Orlen. Tikslus adresas, laikas ir šaltiniai.">
    <link rel="canonical" href="https://vercel.app">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header" id="main-header">
        <div class="container header-inner">
            <div class="logo">Kuro<span>Pulsas.lt</span></div>
            <div class="header-controls">
                <div class="fuel-switch">
                    <button class="fuel-btn active" id="btn-petrol" onclick="switchFuel('petrol')">⛽ Benzinas</button>
                    <button class="fuel-btn" id="btn-diesel" onclick="switchFuel('diesel')">🚛 Dyzelinas</button>
                </div>
                <div class="update-badge" id="last-updated">Kraunama...</div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="summary-bar" id="daily-summary">Kraunama dienos apžvalga...</div>

        <!-- PAGRINDINIS MIESTO IR RAJONO FILTRAS -->
        <div class="top-city-bar">
            <div style="font-weight: 700; font-size: 0.95rem;">📍 Pasirinkite miestą arba rajoną:</div>
            <select id="global-city-select" class="city-select" onchange="changeGlobalCity(this.value)">
                <option value="ALL">🇱🇹 Visa Lietuva (visi miestai)</option>
            </select>
        </div>

        <!-- Pirma lyderių lentelė (A95 arba Dyzelinas) -->
        <h2 class="section-title" id="title-primary-leaders">🏆 Mažiausios A95 benzino kainos šiandien</h2>
        <div class="leaders-grid" id="primary-leaders-grid"></div>

        <!-- Antra lyderių lentelė (tik Benzinui - A98) -->
        <div id="secondary-leaders-section">
            <h2 class="section-title">⚡ Mažiausios A98 benzino kainos šiandien</h2>
            <div class="leaders-grid" id="a98-leaders-grid"></div>
        </div>

        <h2 class="section-title" id="title-networks">⛽ Degalinių tinklai</h2>
        <div class="networks-grid" id="networks-grid"></div>
    </main>

    <!-- Modalinis langas konkretaus tinklo degalinėms -->
    <div id="stations-modal" class="modal-backdrop" onclick="closeModal()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-top">
                <h3 id="modal-title" style="font-size: 1.35rem; font-weight: 800;"></h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <input type="text" id="station-search" placeholder="🔍 Ieškoti pagal miestą arba gatvę..." 
                   oninput="searchStations(this.value)" 
                   style="width: 100%; padding: 10px 14px; margin-bottom: 12px; border: 1px solid var(--border-light); border-radius: 10px; font-size: 0.9rem;">
            <div class="city-filter" id="city-filter"></div>
            <div id="modal-table-container"></div>
        </div>
    </div>

    <script>
        let rawData = null;
        let currentFuel = 'petrol';
        let selectedCity = 'ALL';
        let activeDisplayNetworks = [];
        let activeModalStations = [];

        async function loadPrices() {
            try {
                const res = await fetch('prices.json?v=' + new Date().getTime());
                rawData = await res.json();
                document.getElementById('last-updated').textContent = `Atnaujinta: ${rawData.last_updated}`;
                populateCityDropdown();
                renderAll();
            } catch (err) {
                console.error("Klaida kraunant kainas:", err);
            }
        }

        function populateCityDropdown() {
            const citiesSet = new Set();
            rawData.networks.forEach(net => {
                (net.stations || []).forEach(st => {
                    if (st.city && st.city.trim()) {
                        citiesSet.add(st.city.trim());
                    }
                });
            });
            const sortedCities = Array.from(citiesSet).sort((a, b) => a.localeCompare(b, 'lt'));
            const select = document.getElementById('global-city-select');
            select.innerHTML = `<option value="ALL">🇱🇹 Visa Lietuva (${sortedCities.length} vietovės)</option>` +
                sortedCities.map(c => `<option value="${c}">${c}</option>`).join('');
        }

        function changeGlobalCity(city) {
            selectedCity = city;
            renderAll();
        }

        function switchFuel(fuelType) {
            currentFuel = fuelType;
            const btnPetrol = document.getElementById('btn-petrol');
            const btnDiesel = document.getElementById('btn-diesel');
            const header = document.getElementById('main-header');

            if (fuelType === 'petrol') {
                btnPetrol.className = 'fuel-btn active';
                btnDiesel.className = 'fuel-btn';
                header.style.borderBottomColor = '#10b981';
            } else {
                btnPetrol.className = 'fuel-btn';
                btnDiesel.className = 'fuel-btn diesel-active';
                header.style.borderBottomColor = '#f59e0b';
            }
            renderAll();
        }

        function formatPrice(val) {
            return val ? `${Number(val).toFixed(3)} €` : '—';
        }

        function formatDiff(diff) {
            if (diff === null || diff === undefined) return '';
            const val = Number(diff);
            if (val < -0.0001) {
                return `<span class="diff-badge diff-down">${val.toFixed(3)} € ↓</span>`;
            } else if (val > 0.0001) {
                return `<span class="diff-badge diff-up">+${val.toFixed(3)} € ↑</span>`;
            } else {
                return `<span class="diff-badge diff-same">0.000 € =</span>`;
            }
        }

        function buildCityFilteredNetworks() {
            return rawData.networks.map(net => {
                const cityStations = selectedCity === 'ALL'
                    ? (net.stations || [])
                    : (net.stations || []).filter(s => (s.city || '').trim() === selectedCity);

                if (cityStations.length === 0) return null;

                const findBestStation = (fuelKey) => {
                    const valid = cityStations.filter(s => typeof s[fuelKey] === 'number' && s[fuelKey] > 0);
                    if (valid.length === 0) return null;
                    valid.sort((a, b) => a[fuelKey] - b[fuelKey]);
                    return valid[0];
                };

                const bestA95St = findBestStation('a95');
                const bestA98St = findBestStation('a98');
                const bestDzSt = findBestStation('diesel');

                return {
                    ...net,
                    filteredStations: cityStations,
                    calc_a95: bestA95St ? bestA95St.a95 : (selectedCity === 'ALL' ? net.best_a95 : null),
                    loc_a95: bestA95St ? `${bestA95St.city}, ${bestA95St.address}` : 'Visame tinkle',
                    time_a95: bestA95St ? bestA95St.time : net.price_time,
                    src_a95: bestA95St ? bestA95St.source : net.source_name,

                    calc_a98: bestA98St ? bestA98St.a98 : (selectedCity === 'ALL' ? net.best_a98 : null),
                    loc_a98: bestA98St ? `${bestA98St.city}, ${bestA98St.address}` : 'Visame tinkle',
                    time_a98: bestA98St ? bestA98St.time : net.price_time,
                    src_a98: bestA98St ? bestA98St.source : net.source_name,

                    calc_diesel: bestDzSt ? bestDzSt.diesel : (selectedCity === 'ALL' ? net.best_diesel : null),
                    loc_diesel: bestDzSt ? `${bestDzSt.city}, ${bestDzSt.address}` : 'Visame tinkle',
                    time_diesel: bestDzSt ? bestDzSt.time : net.price_time,
                    src_diesel: bestDzSt ? bestDzSt.source : net.source_name,

                    url_a95: bestA95St ? (bestA95St.source_url || net.source_url) : net.source_url,
                    url_a98: bestA98St ? (bestA98St.source_url || net.source_url) : net.source_url,
                    url_diesel: bestDzSt ? (bestDzSt.source_url || net.source_url) : net.source_url,

                    diff_a95: selectedCity === 'ALL' ? net.diff_a95 : null,
                    diff_a98: selectedCity === 'ALL' ? net.diff_a98 : null,
                    diff_diesel: selectedCity === 'ALL' ? net.diff_diesel : null
                };
            }).filter(Boolean);
        }

        function renderAll() {
            if (!rawData) return;

            const isPetrol = currentFuel === 'petrol';
            document.getElementById('daily-summary').textContent = isPetrol 
                ? rawData.summary_petrol 
                : (rawData.summary_diesel || rawData.summary_petrol);

            const cityLabel = selectedCity === 'ALL' ? 'Lietuvoje' : `mieste/rajone: ${selectedCity}`;
            document.getElementById('title-networks').textContent = `⛽ Degalinių tinklai (${cityLabel})`;

            const filtered = buildCityFilteredNetworks();
            const sortKey = isPetrol ? 'calc_a95' : 'calc_diesel';
            activeDisplayNetworks = filtered.sort((a, b) => (a[sortKey] || 99) - (b[sortKey] || 99));

            if (isPetrol) {
                document.getElementById('title-primary-leaders').textContent = `🏆 Mažiausios A95 benzino kainos (${cityLabel})`;
                renderLeaderCards(activeDisplayNetworks, 'calc_a95', 'diff_a95', 'loc_a95', 'time_a95', 'src_a95', 'url_a95', 'Benzinas A95', '', 'primary-leaders-grid');

                document.getElementById('secondary-leaders-section').style.display = 'block';
                const sortedA98 = [...filtered].sort((a, b) => (a.calc_a98 || 99) - (b.calc_a98 || 99));
                renderLeaderCards(sortedA98, 'calc_a98', 'diff_a98', 'loc_a98', 'time_a98', 'src_a98', 'url_a98', 'Benzinas A98', 'a98-card', 'a98-leaders-grid');
            } else {
                document.getElementById('title-primary-leaders').textContent = `🏆 Mažiausios dyzelino kainos (${cityLabel})`;
                renderLeaderCards(activeDisplayNetworks, 'calc_diesel', 'diff_diesel', 'loc_diesel', 'time_diesel', 'src_diesel', 'url_diesel', 'Dyzelinas (D)', 'diesel-card', 'primary-leaders-grid');
                document.getElementById('secondary-leaders-section').style.display = 'none';
            }

            renderNetworks(activeDisplayNetworks);
        }

        function renderLeaderCards(networks, priceKey, diffKey, locKey, timeKey, srcKey, urlKey, label, extraClass, containerId) {
            // Nustatome, kokį konkretų degalinės lauką tikriname ('a95', 'a98' arba 'diesel')
            const rawFuelKey = priceKey.replace('calc_', '');
            
            // Surenkame VISAS konkrečias degalines pasirinktoje vietovėje, kurios turi šios kuro rūšies kainą
            let candidateStations = [];
            networks.forEach(net => {
                (net.filteredStations || []).forEach(st => {
                    if (typeof st[rawFuelKey] === 'number' && st[rawFuelKey] > 0) {
                        candidateStations.push({
                            networkName: net.name,
                            price: st[rawFuelKey],
                            diff: net[diffKey],
                            location: `${st.city}, ${st.address}`,
                            time: st.time || net.price_time,
                            source: st.source || net.source_name,
                            url: st.source_url || net.source_url
                        });
                    }
                });
            });

            if (candidateStations.length === 0) {
                document.getElementById(containerId).innerHTML = `<p style="color: var(--text-muted);">Šioje vietovėje šios kuro rūšies kainų šiuo metu nėra.</p>`;
                return;
            }

            // Rūšiuojame visas degalines nuo mažiausios kainos ir paimame Top 2
            candidateStations.sort((a, b) => a.price - b.price);
            const topTwo = candidateStations.slice(0, 2);

            document.getElementById(containerId).innerHTML = topTwo.map((st, idx) => `
                <div class="leader-card ${extraClass}">
                    <span class="leader-tag">${idx === 0 ? '🏆 1 vieta — Mažiausia kaina' : '🥈 2 vieta — Antra mažiausia kaina'}</span>
                    <div class="leader-network">${st.networkName}</div>
                    <div class="leader-location">📍 ${st.location}</div>
                    <div class="digital-price-box">
                        <span class="fuel-label">${label}</span>
                        <span class="digital-number">${formatPrice(st.price)}${formatDiff(st.diff)}</span>
                    </div>
                    <div class="meta-info">
                        <span>🕒 Fiksuota: <strong>${st.time}</strong></span>
                        <span>🔗 Šaltinis: <a href="${st.url}" target="_blank" rel="noopener">${st.source} ↗</a></span>
                    </div>
                </div>
            `).join('');
        }
        
        function renderNetworks(networks) {
            const isPetrol = currentFuel === 'petrol';
            if (networks.length === 0) {
                document.getElementById('networks-grid').innerHTML = `<p>Šioje vietovėje duomenų nerasta.</p>`;
                return;
            }

            document.getElementById('networks-grid').innerHTML = networks.map((net, index) => {
                const a98Row = net.calc_a98 
                    ? `<div class="price-row"><span style="font-size: 0.88rem; color: var(--text-muted);">Benzinas A98</span><span class="price-secondary">${formatPrice(net.calc_a98)}${formatDiff(net.diff_a98)}</span></div>` 
                    : '';

                const mainPriceHtml = isPetrol 
                    ? `<div class="price-row"><span style="font-weight: 600;">Benzinas A95</span><span class="price-value">${formatPrice(net.calc_a95)}${formatDiff(net.diff_a95)}</span></div>${a98Row}`
                    : `<div class="price-row"><span style="font-weight: 600;">Dyzelinas (D)</span><span class="price-value">${formatPrice(net.calc_diesel)}${formatDiff(net.diff_diesel)}</span></div>
                       <div class="price-row"><span style="font-size: 0.88rem; color: var(--text-muted);">Benzinas A95</span><span class="price-secondary">${formatPrice(net.calc_a95)}${formatDiff(net.diff_a95)}</span></div>`;

                const displayTime = isPetrol ? net.time_a95 : net.time_diesel;
                const displayLoc = isPetrol ? net.loc_a95 : net.loc_diesel;

                return `
                <div class="network-card">
                    <div>
                        <div class="card-header">
                            <span class="network-name">${net.name}</span>
                        </div>
                        ${mainPriceHtml}
                        <div class="card-meta">
                            <span>📍 Pigiausia: <strong>${displayLoc}</strong></span>
                            <span>🕒 Fiksuota: <strong>${displayTime}</strong></span>
                            <span>🔗 Šaltinis: <a href="${net.source_url}" target="_blank" rel="noopener">${net.source_name} ↗</a></span>
                        </div>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <button class="stations-btn" onclick="openNetworkModal(${index})">
                            Degalinių sąrašas (${net.filteredStations.length}) →
                        </button>
                        <a href="tinklai/${net.id}.html" style="text-align: center; font-size: 0.78rem; color: var(--text-muted); text-decoration: none;">
                            Visas ${net.name} puslapis (SEO) ↗
                        </a>
                    </div>
                </div>
            `}).join('');
        }
        
        function openNetworkModal(index) {
            const net = activeDisplayNetworks[index];
            if (!net) return;

            activeModalStations = net.filteredStations;
            document.getElementById('station-search').value = '';
            document.getElementById('modal-title').textContent = `${net.name} — degalinės ir kainos`;
            
            const cities = ['Visi miestai', ...new Set(activeModalStations.map(s => s.city))];
            document.getElementById('city-filter').innerHTML = cities.map((city, i) => `
                <button class="filter-chip ${i === 0 ? 'active' : ''}" onclick="filterStations('${city}', this)">${city}</button>
            `).join('');

            renderStationsTable(activeModalStations);
            document.getElementById('stations-modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function filterStations(city, btnElement) {
            document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            const filtered = city === 'Visi miestai' 
                ? activeModalStations 
                : activeModalStations.filter(s => s.city === city);
            renderStationsTable(filtered);
        }

        function searchStations(query) {
            const q = query.toLowerCase().trim();
            const filtered = activeModalStations.filter(s => 
                (s.city || '').toLowerCase().includes(q) || (s.address || '').toLowerCase().includes(q)
            );
            renderStationsTable(filtered);
        }

        function renderStationsTable(stations) {
            if (!stations || stations.length === 0) {
                document.getElementById('modal-table-container').innerHTML = `<p>Degalinių nerasta.</p>`;
                return;
            }

            document.getElementById('modal-table-container').innerHTML = `
                <table class="stations-table">
                    <thead>
                        <tr>
                            <th>Miestas</th>
                            <th>Adresas</th>
                            <th>A95</th>
                            <th>A98</th>
                            <th>Dyzelinas</th>
                            <th>Laikas</th>
                            <th>Šaltinis</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${stations.map(s => `
                            <tr>
                                <td><strong>${s.city}</strong></td>
                                <td>${s.address}</td>
                                <td class="mono" style="color: var(--accent-green-dark);">${formatPrice(s.a95)}</td>
                                <td class="mono">${formatPrice(s.a98)}</td>
                                <td class="mono" style="color: #d97706;">${formatPrice(s.diesel)}</td>
                                <td style="font-size: 0.78rem; color: var(--text-muted);">${s.time}</td>
                                <td style="font-size: 0.78rem;">
                                    ${s.source_url ? `<a href="${s.source_url}" target="_blank" rel="noopener" style="color: var(--accent-green-dark);">${s.source} ↗</a>` : s.source}
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function closeModal() {
            document.getElementById('stations-modal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        loadPrices();
    </script>
</body>
</html>
