name: Kasdienis kuro kainų atnaujinimas

on:
  schedule:
    - cron: '15 5,8,12,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Paimti failus
        uses: actions/checkout@v4

      - name: Paruošti Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Įdiegti bibliotekas
        run: pip install requests

      - name: Surinkti ir išanalizuoti kainas
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ENA_API_TOKEN: ${{ secrets.ENA_API_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python main.py

      - name: Išsaugoti prices.json ir SEO puslapius
        run: |
          git config --local user.email "bot@kuropulsas.lt"
          git config --local user.name "KuroPulsas Robotas"
          git add prices.json tinklai/ sitemap.xml robots.txt
          git commit -m "Atnaujintos dienos kuro kainos" || exit 0
          git push
